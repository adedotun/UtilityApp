<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Tweaks — free PDF and Word tools that never upload your files</title>
    <meta
      name="description"
      content="PDF Tweaks is a free PDF and Word toolkit that runs entirely in your browser. Merge, split, convert, sign, edit and compress documents. Your files never leave your device."
    />
    <link rel="canonical" href="https://pdftweaks.adedotun.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pdftweaks.adedotun.dev/" />
    <meta property="og:title" content="PDF Tweaks — PDF tools that never upload your files" />
    <meta
      property="og:description"
      content="Free PDF and Word tools that run entirely in your browser. No uploads, no sign up."
    />
    <meta name="theme-color" content="#4f46e5" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PDF Tweaks",
        "url": "https://pdftweaks.adedotun.dev/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any (web browser)",
        "description": "Free PDF and Word tools that run entirely in the browser: merge, split, rotate, extract, reorder, convert, sign, edit, watermark, compress and password protect PDFs. Files are never uploaded.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Merge PDF", "Split PDF", "Rotate PDF", "Extract pages", "Reorder pages",
          "Images to PDF", "PDF to images", "Word to PDF", "View Word",
          "Sign PDF", "Edit PDF", "Add watermark", "Add page numbers", "Crop PDF",
          "Compress PDF", "Edit metadata", "Password protect", "Remove password"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
