<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileTweaks — free file tools that never upload your files</title>
    <meta
      name="description"
      content="FileTweaks is a free toolkit for PDFs, images, documents and other files that runs entirely in your browser. Merge, split, convert, sign, edit and compress files. Your files never leave your device."
    />
    <link rel="canonical" href="https://filetweaks.adedotun.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://filetweaks.adedotun.dev/" />
    <meta property="og:title" content="FileTweaks — file tools that never upload your files" />
    <meta
      property="og:description"
      content="Free PDF, image, document and file tools that run entirely in your browser. No uploads, no sign up."
    />
    <meta property="og:image" content="https://filetweaks.adedotun.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FileTweaks — an adedotun.dev product" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://filetweaks.adedotun.dev/og-image.png" />
    <meta name="theme-color" content="#4f46e5" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "FileTweaks",
        "url": "https://filetweaks.adedotun.dev/",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Any (web browser)",
        "description": "Free PDF, image, document and file tools that run entirely in the browser: merge, split, rotate, extract, reorder, convert, sign, edit, watermark, compress and password protect PDFs; convert, compress and resize images and remove photo metadata; read and write Word, Markdown, EPUB and spreadsheet files; zip, unzip, hash and QR tools. Files are never uploaded.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Merge PDF", "Split PDF", "Rotate PDF", "Extract pages", "Reorder pages",
          "Images to PDF", "PDF to images", "Word to PDF", "View Word", "OCR PDF",
          "PDF to Word", "Redact PDF",
          "Sign PDF", "Edit PDF", "Add watermark", "Add page numbers", "Crop PDF",
          "Compress PDF", "Edit metadata", "Password protect", "Remove password",
          "Convert image", "Compress image", "Resize image", "Photo data (EXIF)",
          "Image to text", "Word to Markdown", "Markdown to PDF", "EPUB viewer",
          "CSV to Excel", "ZIP files", "Unzip", "File hash",
          "Generate QR code", "Read QR code"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
